<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" rx="16" fill="#0F172A"/>

  <!-- Title -->
  <text x="48" y="52" fill="#F8FAFC" font-size="22" font-weight="600">英語學習系統 · 課程地圖</text>
  <text x="48" y="78" fill="#94A3B8" font-size="13">以通過條件推進，不以日期推進 · 5 道關卡 + 2 條支線</text>

  <!-- Legend -->
  <rect x="720" y="36" width="14" height="14" rx="3" fill="#38BDF8"/>
  <text x="742" y="48" fill="#94A3B8" font-size="11">主線關卡</text>
  <rect x="820" y="36" width="14" height="14" rx="3" fill="#34D399"/>
  <text x="842" y="48" fill="#94A3B8" font-size="11">支線資源</text>

  <!-- Main path arrows -->
  <line x1="196" y1="200" x2="236" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="388" y1="200" x2="428" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="580" y1="200" x2="620" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="772" y1="200" x2="812" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Gate 1 -->
  <rect x="48" y="120" width="148" height="160" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="64" y="136" width="36" height="22" rx="6" fill="url(#gateGrad)"/>
  <text x="82" y="151" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">1</text>
  <text x="64" y="184" fill="#F8FAFC" font-size="15" font-weight="600">累積輸入</text>
  <text x="64" y="210" fill="#94A3B8" font-size="11">連續聽 30 分鐘</text>
  <text x="64" y="228" fill="#94A3B8" font-size="11">不回放、不逐句</text>
  <text x="64" y="246" fill="#94A3B8" font-size="11">翻回母語</text>
  <text x="64" y="268" fill="#38BDF8" font-size="11" font-weight="500">framework.html</text>

  <!-- Gate 2 -->
  <rect x="240" y="120" width="148" height="160" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="256" y="136" width="36" height="22" rx="6" fill="url(#gateGrad)"/>
  <text x="274" y="151" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">2</text>
  <text x="256" y="184" fill="#F8FAFC" font-size="15" font-weight="600">注意力精修</text>
  <text x="256" y="210" fill="#94A3B8" font-size="11">陌生材料聽寫</text>
  <text x="256" y="228" fill="#94A3B8" font-size="11">正確率穩定 90%+</text>
  <text x="256" y="246" fill="#94A3B8" font-size="11">能指出錯在哪一類</text>
  <text x="256" y="268" fill="#34D399" font-size="11" font-weight="500">→ story-bank</text>

  <!-- Gate 3 -->
  <rect x="432" y="120" width="148" height="160" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="448" y="136" width="36" height="22" rx="6" fill="url(#gateGrad)"/>
  <text x="466" y="151" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">3</text>
  <text x="448" y="184" fill="#F8FAFC" font-size="15" font-weight="600">受控輸出</text>
  <text x="448" y="210" fill="#94A3B8" font-size="11">第二版明顯優於</text>
  <text x="448" y="228" fill="#94A3B8" font-size="11">第一版，改動是</text>
  <text x="448" y="246" fill="#94A3B8" font-size="11">自己看出來的</text>
  <text x="448" y="268" fill="#34D399" font-size="11" font-weight="500">→ exam-track</text>

  <!-- Gate 4 -->
  <rect x="624" y="120" width="148" height="160" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="640" y="136" width="36" height="22" rx="6" fill="url(#gateGrad)"/>
  <text x="658" y="151" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">4</text>
  <text x="640" y="184" fill="#F8FAFC" font-size="15" font-weight="600">自由輸出</text>
  <text x="640" y="210" fill="#94A3B8" font-size="11">被追問、被打斷、</text>
  <text x="640" y="228" fill="#94A3B8" font-size="11">被換話題時</text>
  <text x="640" y="246" fill="#94A3B8" font-size="11">仍撐得住</text>
  <text x="640" y="268" fill="#64748B" font-size="11">framework.html</text>

  <!-- Gate 5 -->
  <rect x="816" y="120" width="100" height="160" rx="12" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <rect x="832" y="136" width="36" height="22" rx="6" fill="#FBBF24"/>
  <text x="850" y="151" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700">5</text>
  <text x="832" y="184" fill="#F8FAFC" font-size="14" font-weight="600">用它</text>
  <text x="832" y="204" fill="#F8FAFC" font-size="14" font-weight="600">做事</text>
  <text x="832" y="230" fill="#94A3B8" font-size="11">這週用英文</text>
  <text x="832" y="246" fill="#94A3B8" font-size="11">完成一件事</text>
  <text x="832" y="268" fill="#FBBF24" font-size="11" font-weight="500">終點</text>

  <!-- Side branch connectors -->
  <path d="M 314 280 L 314 340 L 200 340" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M 506 280 L 506 340 L 640 340" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- Story bank card -->
  <rect x="48" y="356" width="320" height="120" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="1.5" opacity="0.95"/>
  <text x="72" y="388" fill="#34D399" font-size="13" font-weight="600">經歷語料庫 · story-bank.html</text>
  <text x="72" y="414" fill="#A7F3D0" font-size="12">通過第二關後開始建立</text>
  <text x="72" y="434" fill="#A7F3D0" font-size="12">五塊結構 · 模板 · 虛構範例 · 共用語塊</text>
  <text x="72" y="454" fill="#6EE7B7" font-size="11">把真實經歷寫成可重複使用的英文段落</text>

  <!-- Exam track card -->
  <rect x="400" y="356" width="320" height="120" rx="12" fill="#1E3A5F" stroke="#38BDF8" stroke-width="1.5" opacity="0.95"/>
  <text x="424" y="388" fill="#38BDF8" font-size="13" font-weight="600">考試軌道 · exam-track.html</text>
  <text x="424" y="414" fill="#BAE6FD" font-size="12">通過第三關後才進去（可選窄軌）</text>
  <text x="424" y="434" fill="#BAE6FD" font-size="12">TOEFL 2026 改制 · CEFR 對照 · 時間估算</text>
  <text x="424" y="454" fill="#7DD3FC" font-size="11">八週衝刺模板</text>

  <!-- AI skills card -->
  <rect x="752" y="356" width="164" height="120" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="772" y="388" fill="#A78BFA" font-size="13" font-weight="600">AI Skills ×3</text>
  <text x="772" y="412" fill="#C4B5FD" font-size="11">writing-coach</text>
  <text x="772" y="430" fill="#C4B5FD" font-size="11">speaking-drill</text>
  <text x="772" y="448" fill="#C4B5FD" font-size="11">story-bank</text>

  <!-- Bottom note -->
  <text x="48" y="520" fill="#64748B" font-size="12">沒達到就留在原地 —— 這不是落後，是這套系統正常運作的樣子。</text>
</svg>
